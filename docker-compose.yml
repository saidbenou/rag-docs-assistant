services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data                     # persisted PDFs + Chroma index
      - hf_cache:/root/.cache/huggingface    # embedding model downloaded only once
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  hf_cache:
  ollama_models:
